name: Validate HTML

on:
  push:
    branches: [main]
  pull_request:

jobs:
  html-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npx --yes html-validate@11 "*.html" "portfolio/*.html"
      - run: node tools/check-links.js
      - run: node -e "for (const f of ['manifest.json', '.htmlvalidate.json']) JSON.parse(require('fs').readFileSync(f, 'utf8'))"
